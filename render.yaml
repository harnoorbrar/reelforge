services:
  - type: web
    name: reelforge
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 run:app"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: OPENAI_API_KEY
        sync: false          # optional: enables LLM scripts
      - key: FAL_KEY
        sync: false          # optional: upgrades image quality
